[versions]
agp = "9.4.1"
# Pinned to match Lumen; AGP's built-in Kotlin otherwise uses its own, older compiler, which
# can't read LiteRT 2.3's metadata.
kotlin = "2.4.21"
coreKtx = "1.19.1"
coroutines = "1.11.0"
junit = "4.13.2"
orgJson = "20260814"
work = "2.12.0"
# Sample app only
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
# 1.29+ bundles Microsoft telemetry (1DS: device id, locale, events sent on app start via a
# ContentProvider). Stay on 1.28 unless a newer release is checked to be telemetry-free
# (unzip the AAR: no ai/onnxruntime/telemetry classes).
onnxruntime = "1.28.0"
litert = "2.3.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
litert = { module = "com.google.ai.edge.litert:litert", version.ref = "litert" }
litert-gpu = { module = "com.google.ai.edge.litert:litert-gpu", version.ref = "litert" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "orgJson" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
